<!doctype html><html lang=ur dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>پروڈکٹ | عارفی دارالشفاء</title><link rel=icon href=logo.webp><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel=stylesheet><link rel=stylesheet href=style.css></head><body><main id=m></main><script src=products.js></script><script src=data.js></script><script src=app.js></script><script>lay();
const p=gp(new URLSearchParams(location.search).get('id'));let vi=0,q=1;
function draw(){const pr=p.v[vi][1],lb=p.v[vi][0];
$('#m').innerHTML=`<div class=box style=text-align:center>${p.img?'<img src='+p.img+' alt="" style="width:100%;max-width:360px;border-radius:14px">':"<div style='background:var(--c) url(logo.webp) center/40% no-repeat;aspect-ratio:16/10;border-radius:14px'></div>"}<h1 style='font-weight:400;color:var(--g);font-size:1.6rem'>${p.n}</h1>
${lb||p.v.length>1?'<div>'+p.v.map((v,i)=>'<button class="pill '+(i==vi?'on':'')+'" onclick="vi='+i+';draw()">'+v[0]+(v[1]?' — '+fmt(v[1]):'')+'</button>').join('')+'</div>':''}
${pr?'<p><span class=big>'+fmt(pr)+'</span></p><div class=qty><button onclick="q>1&&(q--,draw())">−</button>'+q+'<button onclick="q++,draw()">+</button></div>':'<p>قیمت کے لیے واٹس ایپ پر رابطہ کریں</p>'}
<p><a class='btn wa' target=_blank href="${wa('میں "'+p.n+'" '+(lb?'('+lb+') ':'')+'× '+q+(pr?' آرڈر کرنا چاہتا ہوں۔ قیمت: '+fmt(pr*q):' کے بارے میں معلومات چاہتا ہوں'))}">واٹس ایپ پر ابھی آرڈر کریں</a></p>
${pr?'<button class="btn lt" onclick="add(p.id,vi,q)">🛒 کارٹ میں ڈالیں</button>':''}</div>
<div class=tr><div><i>🌿</i>100% ہربل</div><div><i>💵</i>کیش آن ڈیلیوری</div><div class=w><i>🚚</i>پورے پاکستان میں فری ہوم ڈیلیوری</div></div>${desc(p)?'<div class="box ds">'+desc(p)+(p.vid?'<p style=text-align:center><a class="btn lt" target=_blank href="'+p.vid+'">▶ ویڈیو دیکھیں</a></p>':'')+'</div>':''}`}
if(!p)location.href='index.html';else{document.title=p.n;draw()}</script></body></html>
