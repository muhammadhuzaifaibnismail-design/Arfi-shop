<!doctype html><html lang=ur dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>ہمارا تعارف | عارفی دارالشفاء</title><link rel=icon href=logo.webp><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel=stylesheet><link rel=stylesheet href=style.css></head><body><main id=m></main><script src=products.js></script><script src=data.js></script><script src=app.js></script><script>lay();$('#m').innerHTML='<h2>حکیم محمد حذیفہ کا مختصر تعارف</h2><div class=box>'+["تمام معزز قارئین پر سلامتی ہو! آپ کا اعتماد میرا قیمتی اثاثہ ہے، مجھے اس اعتماد کے قابل سمجھنے کے لیے صد بار شکریہ۔ اگر آپ پہلی مرتبہ میری ویب سائٹ پر تشریف لائے ہیں تو میں آپ کے اس انتخاب کو سعادت سمجھتا ہوں۔ آپ سے گزارش ہے کہ یہ تعارفی تحریر مکمل پڑھ لیں تاکہ آپ میری شخصیت اور خدمات سے روشناس ہو سکیں.", "معزز قارئین، دراصل اپنی پہچان چھپا کر کام کرنا دھوکہ دہی کے زمرے میں آتا ہے اور الحمدللہ ہم دھوکہ دینے والوں میں سے ہرگز نہیں۔ بندۂ ناچیز کے والدِ گرامی حکیم ابنِ حکیم محمد اسماعیل نے اپنے اس سپوت کو محمد حذیفہ کے نام سے دنیا میں پہچان بخشی۔ اپنے اجداد کی اطاعت کرتے ہوئے عارف والا ضلع پاکپتن (بابا فرید الدین گنج شکر کی نگری) کو اپنا مسکن بنائے رکھا ہے۔", "والدِ گرامی کی خصوصی توجہ اور کامل تربیت کی بدولت دینی علوم میں رغبت رہی اور فضلِ ربی سے قرآن کریم حفظ کر لیا، جبکہ مزید درسِ نظامی کی تکمیل بھی نصیب ہوئی۔ علاوہ ازیں، عصری تعلیم کے میدان میں ایف اے تک رسائی حاصل کر سکا۔", "دکھی انسانیت کے کام آنا میری تربیت کا حاصل رہا، تاہم طب کی دنیا میں ایک ماہر کی حیثیت سے خدمات پیش کرنا میرا ایک خواب بن گیا۔ نہایت محنت اور لگن سے اپنے اس عظیم خواب کو شرمندۂ تعبیر کر کے بطور فاضلِ طب والجراحت سند فضیلت حاصل کی (الحمدللہ رب العالمین) اور مطب عارفی دارالشفاء میں طبی خدمات سر انجام دیتا ہوں۔", "عارفی دارالشفاء میرے بزرگوں کی بشارت تھی اور انہی کی دعاؤں سے بفضلہ تعالیٰ میری انتھک محنتوں کا ثمر ہے۔ یہی میرا خواب تھا، یہی میرا مقصد۔ اللہ تعالیٰ میری توفیقات میں مزید اضافہ فرمائے تاکہ میں تکلیف میں مبتلا اللہ کے بندوں کی تکلیفیں دور کر سکوں۔ آمین ثم آمین"].map(x=>'<p>'+x+'</p>').join('')+'</div>';</script></body></html>
