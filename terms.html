عارفی دارالشفاء تمام آرڈرز جانچ پڑتال کے بعد صحیح طور پر پیکنگ کر کے روانہ کرتا ہے۔ تاہم کسی وجہ سے اگر غلط آرڈر ڈیلیور ہو جائے یا پارسل ٹوٹ پھوٹ کا شکار ہو جائے تو فوراً عارفی دارالشفاء میں بذریعہ کال یا واٹس ایپ اطلاع دیں۔", "اگر ڈیلیوری کے وقت پارسل کی پیکنگ برقرار نہ ہو تو کسی صورت پارسل وصول نہ کریں اور عارفی دارالشفاء کو بذریعہ کال یا واٹس ایپ اطلاع دیں۔ پیکنگ خراب ہونے کے باوجود پارسل وصول کر لینے کی صورت میں عارفی دارالشفاء ذمہ دار نہ ہو گا۔", "تمام ادویات کے اجزاء کے خالص ہونے کی گارنٹی دی جاتی ہے۔ شفاء من جانب اللہ ہے، اس لیے شفاء کی گارنٹی دینا ممکن نہیں ہوتا۔ بہترین اور خالص اجزاء کی وجہ سے ادویات کی شفایابی کا رزلٹ 95% تک بہترین ہوتا ہے۔ آپ کسی بھی صحت کے مسئلے کا شکار ہیں تو ایک دفعہ عارفی دارالشفاء کو ضرور آزمائیں، ان شاء اللہ مایوسی نہیں ہو گی۔", "تمام قدرتی پروڈکٹس مثلاً شہد، سلاجیت وغیرہ کی چیک وارنٹی دی جاتی ہے۔ اگر پسند نہ آئے تو آپ واپس کر کے پیمنٹ ری فنڈ کروا سکتے ہیں۔", "پارسل کورئیر کمپنی میں بک ہونے کے بعد کینسل کرنے کی صورت میں ڈیلیوری چارجز ادا کرنا ہوں گے۔", "تمام ادویات سیل بند ہونے کی حالت میں قابلِ واپسی ہیں۔ واپس بھیجنے کا خرچ خریدار کے ذمہ ہو گا۔", "عارفی دارالشفاء کے طبی ماہرین سے مشورے کے لیے یا کسی بھی مسئلے کی صورت میں ہفتہ تا جمعرات صبح 9 سے شام 5 بجے کے درمیان بذریعہ کال یا واٹس ایپ رابطہ کیا جا سکتا ہے: <bdi dir=ltr>0311-1307530</bdi>"];
