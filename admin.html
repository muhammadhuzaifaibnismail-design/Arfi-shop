<!doctype html><html lang=ur dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex,nofollow"><title>ایڈمن | عارفی دارالشفاء</title><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel=stylesheet><link rel=stylesheet href=style.css><style>body{padding:0 0 40px}textarea{width:100%;font:inherit;padding:4px 10px;border:1px solid #bbb;border-radius:10px;margin:2px 0 8px;min-height:120px}label{display:block;margin-top:6px;color:var(--g)}.ck{display:inline-block;margin:2px 8px 2px 0}.ck input{width:auto;margin:0 4px}.it{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:4px 0;cursor:pointer}.it img{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--c)}.it div{flex:1}.it small{display:block;color:#666;line-height:1.5;font-family:sans-serif}.red{background:#b3261e}</style></head><body>
<div class=top>⚙️ ایڈمن پینل</div><div id=a></div><div id=toast></div>
<script>
const $=s=>document.querySelector(s),CT=[["c","بچوں کی ادویات"],["m","مردوں کی ادویات"],["w","عورتوں کی ادویات"],["s","معدے کی ادویات"],["k","جلد کی ادویات"]];
let cfg={},L=[],sha="",cur=null;try{cfg=JSON.parse(localStorage.getItem("adm")||"{}")}catch(e){}
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),3200)};
const u8=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,"")))),b8=s=>btoa(unescape(encodeURIComponent(s)));
async function gh(path,m="GET",body){const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`+(m=="GET"?`?ref=${cfg.br}&t=${Date.now()}`:""),{method:m,headers:{Authorization:"Bearer "+cfg.tk,Accept:"application/vnd.github+json"},body:body&&JSON.stringify(body)});
 if(!r.ok)throw new Error(r.status==401?"ٹوکن درست نہیں":r.status==404?"ریپوزٹری یا فائل نہیں ملی":r.status==409?"فائل کسی اور جگہ سے بدل چکی ہے، صفحہ ریفریش کریں":"خرابی "+r.status);return r.json()}
async function load(){const f=await gh("products.js");sha=f.sha;L=JSON.parse(u8(f.content).replace(/^[^=]*=/,"").replace(/;\s*$/,""))}
async function save(msg){const r=await gh("products.js","PUT",{message:msg,branch:cfg.br,sha,content:b8("const PRODUCTS="+JSON.stringify(L,null,1)+";\n")});sha=r.content.sha}
function login(){$("#a").innerHTML=`<div class=box><h2 style=margin:0>لاگ اِن</h2><label>GitHub ریپوزٹری (مثلاً username/arfi-site)</label><input id=rp dir=ltr value="${cfg.repo||""}"><label>برانچ</label><input id=br dir=ltr value="${cfg.br||"main"}"><label>GitHub ٹوکن</label><input id=tk type=password dir=ltr value="${cfg.tk||""}"><button class="btn wa" onclick=go()>داخل ہوں</button><div class=info>ٹوکن صرف آپ کے اس فون کے براؤزر میں محفوظ رہتا ہے۔</div></div>`}
async function go(){cfg={repo:$("#rp").value.trim(),br:$("#br").value.trim()||"main",tk:$("#tk").value.trim()};try{await load();localStorage.setItem("adm",JSON.stringify(cfg));list()}catch(e){toast("❌ "+e.message)}}
function list(q=""){const x=L.filter(p=>p.n.includes(q));$("#a").innerHTML=`<div class=box><button class="btn wa" onclick="edit(-1)">➕ نئی پروڈکٹ</button><input id=q placeholder="تلاش کریں" value="${q}" oninput="list(this.value)" style="margin-top:10px"><div>${x.map(p=>`<div class=it onclick="edit(${L.indexOf(p)})"><img src="${p.img||"logo.webp"}" alt=""><div>${p.n}<small>${(p.v||[]).map(v=>v[1]).join(" / ")} Rs</small></div>›</div>`).join("")}</div><button class="btn lt" style=margin-top:12px onclick="localStorage.removeItem('adm');cfg={};login()">لاگ آؤٹ</button></div>`;const i=$("#q");i.focus();i.setSelectionRange(99,99)}
function edit(i){cur=i;const p=i<0?{id:"p"+Date.now().toString(36),n:"",c:[],v:[["",0]],t:""}:L[i];
$("#a").innerHTML=`<div class=box><h2 style=margin:0>${i<0?"نئی پروڈکٹ":"پروڈکٹ ایڈٹ کریں"}</h2><label>پروڈکٹ کا نام</label><input id=n value="${p.n}"><label>کیٹیگری</label>${CT.map(c=>`<span class=ck><input type=checkbox value=${c[0]} ${p.c.includes(c[0])?"checked":""}>${c[1]}</span>`).join("")}<label>پیکنگ اور قیمت (ہر لائن میں: پیکنگ | قیمت)</label><textarea id=v dir=auto style="min-height:80px">${p.v.map(v=>v[0]+" | "+v[1]).join("\n")}</textarea><div class=info>مثال: 30 کیپسول | 1500<br>قیمت 0 ہو تو "رابطہ کریں" لکھا آئے گا۔</div><label>ڈسکرپشن</label><textarea id=t>${p.t||""}</textarea><div class=info>خالی لائن = نیا پیراگراف۔ لائن کے شروع میں "# " = عنوان، "- " = فہرست۔ **موٹا لفظ**۔</div><label>ویڈیو لنک (اختیاری)</label><input id=vd dir=ltr value="${p.vid||""}"><label>تصویر</label>${p.img?`<img src="${p.img}" style="width:90px;border-radius:10px"><br>`:""}<input id=im type=file accept=image/*><button class="btn wa" style=margin-top:10px onclick=sv()>💾 محفوظ کریں</button>${i<0?"":`<button class="btn red" style=margin-top:8px onclick=del()>🗑 حذف کریں</button>`}<button class="btn lt" style=margin-top:8px onclick=list()>واپس</button></div>`}
async function sv(){const n=$("#n").value.trim();if(!n){toast("نام لکھیں");return}toast("⏳ محفوظ ہو رہا ہے...");
 const p=cur<0?{id:"p"+Date.now().toString(36)}:{...L[cur]};p.n=n;p.c=[...document.querySelectorAll(".ck input:checked")].map(x=>x.value);
 p.v=$("#v").value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const k=s.lastIndexOf("|");return k<0?["",Number(s.replace(/\D/g,""))||0]:[s.slice(0,k).trim(),Number(s.slice(k+1).replace(/[^\d.]/g,""))||0]});if(!p.v.length)p.v=[["",0]];
 p.t=$("#t").value.trim();p.vid=$("#vd").value.trim()||undefined;
 try{const f=$("#im").files[0];if(f){const b=await createImageBitmap(f),s=Math.min(1,700/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*s;c.height=b.height*s;c.getContext("2d").drawImage(b,0,0,c.width,c.height);const nm=p.id+".jpg";let o;try{o=(await gh(nm)).sha}catch(e){}
  await gh(nm,"PUT",{message:"image "+nm,branch:cfg.br,content:c.toDataURL("image/jpeg",.82).split(",")[1],...(o?{sha:o}:{})});p.img=nm}
  cur<0?L.push(p):L[cur]=p;await save((cur<0?"add ":"edit ")+p.n);toast("✅ محفوظ ہو گیا — 1 سے 2 منٹ میں سائٹ پر نظر آئے گا");list()}catch(e){toast("❌ "+e.message)}}
async function del(){if(!confirm("یہ پروڈکٹ مستقل حذف ہو جائے گی۔ ٹھیک ہے؟"))return;try{const n=L[cur].n;L.splice(cur,1);await save("delete "+n);toast("🗑 حذف ہو گئی");list()}catch(e){toast("❌ "+e.message)}}
cfg.tk?go():login();
</script></body></html>
