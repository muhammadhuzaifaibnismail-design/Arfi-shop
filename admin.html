 if(!r.ok)throw new Error(r.status==401?"ٹوکن درست نہیں":r.status==404?"ریپوزٹری یا فائل نہیں ملی":r.status==409?"فائل کسی اور جگہ سے بدل چکی ہے، صفحہ ریفریش کریں":"خرابی "+r.status);return r.json()}

function hedit2(i){HE=i;rfill(H[i]);$("#rp2").value=H[i].p||"";toast("✏️ نیچے فارم میں تبدیلی کریں")}
async function hadd(){const r=rnew();if(!r)return;r.p=$("#rp2").value.trim();
 if(HE>=0&&H[HE]){const k=HE,o=H[k];H[k]={...o,...r};try{await hsave("edit home feedback");toast("✅ تبدیلی محفوظ ہو گئی")}catch(e){H[k]=o;toast("❌ "+e.message)}hshow();return}
 H.push(r);try{await hsave("home feedback");toast("✅ محفوظ ہو گیا")}catch(e){H.pop();toast("❌ "+e.message)}hshow()}

async function backup(){try{toast("⏳ بیک اپ تیار ہو رہا ہے...");await load();await hload();const im={};const ns=[...new Set(L.map(p=>p.img).filter(Boolean))];let k=0;
 for(const n of ns){k++;toast("⏳ تصویریں محفوظ ہو رہی ہیں "+k+"/"+ns.length);try{im[n]=await b64of(n)}catch(e){}}
 const d={app:"arfi-shop-backup",v:1,date:new Date().toISOString(),products:L,homeReviews:H,discounts:DS,images:im},bl=new Blob([JSON.stringify(d)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(bl);a.download="arfi-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
 toast("✅ بیک اپ ڈاؤن لوڈ ہو گیا ("+L.length+" پروڈکٹس، "+Object.keys(im).length+" تصویریں)")}catch(e){toast("❌ "+e.message)}}
async function restore(inp){const f=inp.files[0];inp.value="";if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){toast("❌ فائل درست نہیں");return}
 if(d.app!="arfi-shop-backup"||!Array.isArray(d.products)){toast("❌ یہ ہماری بیک اپ فائل نہیں");return}
 if(!confirm("بیک اپ ("+d.products.length+" پروڈکٹس، "+Object.keys(d.images||{}).length+" تصویریں) بحال ہو گا۔\nموجودہ تمام پروڈکٹس اور فیڈبیک اس بیک اپ سے بدل جائیں گے۔ جاری رکھیں؟"))return;
 try{const ns=Object.keys(d.images||{});let k=0;
  for(const n of ns){k++;toast("⏳ تصویریں بحال ہو رہی ہیں "+k+"/"+ns.length);let o;try{o=(await gh(n)).sha}catch(e){}await gh(n,"PUT",{message:"restore image "+n,branch:cfg.br,content:d.images[n],...(o?{sha:o}:{})})}
  toast("⏳ پروڈکٹس بحال ہو رہی ہیں...");await load();L=d.products;if(d.discounts!==undefined)DS=d.discounts;await save("restore backup");
  await hload();H=d.homeReviews||[];await hsave("restore home feedback");
  k=0;for(const p of L){k++;toast("⏳ لنک بن رہے ہیں "+k+"/"+L.length);try{await ensureStub(p.s||p.id,p.n,p.md)}catch(e){}}
  toast("✅ بیک اپ بحال ہو گیا — 1 سے 2 منٹ میں سائٹ پر نظر آئے گا");list()}catch(e){toast("❌ "+e.message)}}
function login(){$("#a").innerHTML=`<div class=box><h2 style=margin:0>لاگ اِن</h2><label>GitHub ریپوزٹری (مثلاً username/arfi-site)</label><input id=rp dir=ltr value="${cfg.repo||""}"><label>برانچ</label><input id=br dir=ltr value="${cfg.br||"main"}"><label>GitHub ٹوکن</label><input id=tk type=password dir=ltr value="${cfg.tk||""}"><button class="btn wa" onclick=go()>داخل ہوں</button><div class=info>ٹوکن صرف آپ کے اس فون کے براؤزر میں محفوظ رہتا ہے۔</div></div>`}

 $("#tc").innerHTML=`<div class=box>${DNEW?'<div class=info style=margin-bottom:8px>ℹ️ آپ کے موجودہ کوڈز نیچے لے آئے گئے ہیں۔ پہلی بار محفوظ کرنے پر ڈسکاؤنٹ کا نیا سسٹم فعال ہو جائے گا۔</div>':""}${saleHtml()}<h3>🎟 ڈسکاؤنٹ کوڈز</h3>${DS.codes.length?DS.codes.map((c,i)=>{const u=Number(UC[c.id])||0,ex=c.exp?(new Date(c.exp+"T23:59:59")<now?"⛔ ختم ("+c.exp+")":"تا "+c.exp):"بغیر مدت",full=c.max>0&&u>=c.max;

async function dsave(msg,old){try{toast("⏳ محفوظ ہو رہا ہے...");await save(msg);DNEW=false;toast("✅ محفوظ ہو گیا — 1 سے 2 منٹ میں سائٹ پر لاگو ہوگا");CE=-1}catch(e){if(old)DS=JSON.parse(old);toast("❌ "+e.message)}dshow()}
async function siteSave(){const on=$("#ssn").checked,pct=Number($("#ssp").value),end=$("#sse").value;if(on&&!(pct>=1&&pct<=99)){toast("فیصد 1 سے 99 کے درمیان لکھیں");return}if(on&&end&&new Date(end)<=new Date()){toast("ختم ہونے کا وقت گزر چکا ہے");return}
 const old=JSON.stringify(DS);DS.sale.site={on,pct:pct||10,end};await dsave("site sale",old)}
async function itAdd(){const ids=[...document.querySelectorAll("#spl input:checked")].map(x=>x.value),pct=Number($("#spp").value),end=$("#spe").value;
 if(!ids.length){toast("کم از کم ایک پروڈکٹ منتخب کریں");return}if(!(pct>=1&&pct<=99)){toast("فیصد 1 سے 99 کے درمیان لکھیں");return}if(end&&new Date(end)<=new Date()){toast("ختم ہونے کا وقت گزر چکا ہے");return}
 const old=JSON.stringify(DS);DS.sale.items=DS.sale.items.filter(x=>!ids.includes(x.id)).concat(ids.map(id=>({id,pct,end,on:true})));await dsave("product sale",old)}

async function cdDel(i){if(!confirm("یہ کوڈ ڈیلیٹ کر دیں؟"))return;const old=JSON.stringify(DS);DS.codes.splice(i,1);await dsave("remove code",old)}
async function cdSave(){const k=$("#cdk").value.trim().toUpperCase().replace(/\s+/g,""),type=$("#cdt").value,val=Number($("#cdv").value),max=Math.max(0,Math.floor(Number($("#cdm").value)||0)),m=$("#cde").value;
 if(!k){toast("کوڈ لکھیں");return}if(!(val>0)||(type=="pct"&&val>100)){toast(type=="pct"?"فیصد 1 سے 100 کے درمیان لکھیں":"رقم درست لکھیں");return}
 if(DS.codes.some((x,j)=>j!=CE&&x.k==k)){toast("یہ کوڈ پہلے سے موجود ہے");return}
 let exp="";if(m=="d"){const n=Math.floor(Number($("#cdd").value));if(!(n>0)){toast("دنوں کی تعداد لکھیں");return}const d=new Date();d.setDate(d.getDate()+n-1);exp=ymd(d)}else if(m=="t"){exp=$("#cdx").value;if(!exp){toast("تاریخ منتخب کریں");return}}
 const o={id:CE>=0?DS.codes[CE].id:"c"+Date.now().toString(36),k,type,val,max,exp,popup:$("#cdp").checked,on:CE>=0?DS.codes[CE].on!==false:true};
 const old=JSON.stringify(DS);if(o.popup)DS.codes.forEach(x=>x.popup=false);if(CE>=0)DS.codes[CE]=o;else DS.codes.push(o);await dsave("discount code "+k,old)}
