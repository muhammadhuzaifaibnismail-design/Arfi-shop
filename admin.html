<!doctype html><html lang=ur dir=rtl><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content="noindex,nofollow"><title>ایڈمن | عارفی دارالشفاء</title><link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap" rel=stylesheet><script>var BASE="/";(function(){var h=location.hostname,p=location.pathname;if(/\.github\.io$/.test(h))BASE="/"+p.split("/")[1]+"/";else if(location.protocol=="file:")BASE=p.replace(/[^\/]*$/,"");document.write('<base href="'+BASE+'"><link rel=stylesheet href=style.css>')})()</script><style>body{padding:0 0 40px}textarea{width:100%;font:inherit;padding:4px 10px;border:1px solid #bbb;border-radius:10px;margin:2px 0 8px;min-height:120px}label{display:block;margin-top:6px;color:var(--g)}.ck{display:inline-block;margin:2px 8px 2px 0}.ck input{width:auto;margin:0 4px}.it{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:4px 0;cursor:pointer}.it img{width:46px;height:46px;border-radius:8px;object-fit:cover;background:var(--c)}.it div{flex:1}.it small{display:block;color:#666;line-height:1.5;font-family:sans-serif}.red{background:#b3261e}h3{color:var(--g);font-weight:400;margin:14px 0 2px;border-bottom:2px solid var(--gold)}.rvi{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid #eee;padding:4px 0}.rvi div{flex:1;font-size:.9rem;line-height:1.9}.rvi button{background:none;border:0;font-size:1.3rem;color:#c00;cursor:pointer}.rvf{background:var(--c);border:1px dashed var(--gold);border-radius:12px;padding:8px 10px;margin-top:6px}select{font:inherit;padding:2px 8px;border:1px solid #bbb;border-radius:10px;margin:2px 4px 8px 0;background:#fff}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{width:auto;flex:1;min-width:140px}</style></head><body>
<div class=top>⚙️ ایڈمن پینل</div><div id=a></div><div id=toast></div>
<script>
const $=s=>document.querySelector(s),CT=[["c","بچوں کی ادویات"],["m","مردوں کی ادویات"],["w","عورتوں کی ادویات"],["s","معدے کی ادویات"],["k","جلد کی ادویات"]];
let cfg={},L=[],sha="",cur=null;try{cfg=JSON.parse(localStorage.getItem("adm")||"{}")}catch(e){}
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),3200)};
const u8=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,"")))),b8=s=>btoa(unescape(encodeURIComponent(s)));
async function gh(path,m="GET",body){const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`+(m=="GET"?`?ref=${cfg.br}&t=${Date.now()}`:""),{method:m,headers:{Authorization:"Bearer "+cfg.tk,Accept:"application/vnd.github+json"},body:body&&JSON.stringify(body)});
 if(!r.ok)throw new Error(r.status==401?"ٹوکن درست نہیں":r.status==404?"ریپوزٹری یا فائل نہیں ملی":r.status==409?"فائل کسی اور جگہ سے بدل چکی ہے، صفحہ ریفریش کریں":"خرابی "+r.status);return r.json()}
async function load(){const f=await gh("products.js");sha=f.sha;L=JSON.parse(u8(f.content).replace(/^[^=]*=/,"").replace(/;\s*$/,""))}
async function save(msg){const r=await gh("products.js","PUT",{message:msg,branch:cfg.br,sha,content:b8("const PRODUCTS="+JSON.stringify(L,null,1)+";\n")});sha=r.content.sha}

const RES=["admin","cart","all-medicine","children-medicine","mens-medicine","womens-medicine","stomach-medicine","skin-medicine","diseases-and-treatments","introduction","terms-and-conditions"],esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let RT=[],STUB=null,H=[],hsha="";
async function stubOf(name,md){if(!STUB){const f=await gh("product.html");STUB=u8(f.content)}return STUB.replace(/<title>[^<]*<\/title>/,"<title>"+esc(name)+" | عارفی دارالشفاء</title><meta name=description content=\""+esc(md||(name+" — عارفی دارالشفاء کی خالص ہربل دوا۔ پورے پاکستان میں فری ہوم ڈیلیوری اور کیش آن ڈیلیوری۔"))+"\">")}
async function ensureStub(slug,name,md){if(!slug)return;const path=slug+"/index.html";let o;try{o=(await gh(path)).sha}catch(e){}
 await gh(path,"PUT",{message:"page "+slug,branch:cfg.br,content:b8(await stubOf(name,md)),...(o?{sha:o}:{})})}
async function b64of(name){const f=await gh(name);if(f.content)return f.content.replace(/\n/g,"");const r=await fetch(f.download_url),bl=await r.blob();return await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result.split(",")[1]);fr.onerror=no;fr.readAsDataURL(bl)})}
async function hload(){try{const f=await gh("home-reviews.js");hsha=f.sha;H=JSON.parse(u8(f.content).replace(/^[^=]*=/,"").replace(/;\s*$/,""))}catch(e){if(String(e.message).includes("نہیں ملی")){H=[];hsha=""}else throw e}}
async function hsave(msg){const b={message:msg,branch:cfg.br,content:b8("const HOME_RV="+JSON.stringify(H,null,1)+";\n")};if(hsha)b.sha=hsha;const r=await gh("home-reviews.js","PUT",b);hsha=r.content.sha}
function rl(){const e=$("#rl");if(e)e.innerHTML=RT.length?RT.map((r,i)=>`<div class=rvi><div><b>${esc(r.n)}</b> ${r.g=="f"?"👩":"👨"} ${"⭐".repeat(r.s||5)}<br>${esc(r.t).slice(0,110)}${r.t.length>110?"…":""}</div><button onclick="rdel(${i})">🗑</button></div>`).join(""):"<div class=info>ابھی کوئی فیڈبیک نہیں۔</div>"}
function rdel(i){RT.splice(i,1);rl()}
function rnew(){const n=$("#rn").value.trim(),t=$("#rx").value.trim();if(!n||!t){toast("نام اور فیڈبیک لکھیں");return null}const r={n,g:$("#rg").value,s:Number($("#rs").value),t};$("#rn").value="";$("#rx").value="";return r}
function radd(){const r=rnew();if(r){RT.push(r);rl();toast("✔ فیڈبیک شامل ہو گیا — اوپر محفوظ کریں دبائیں")}}
const rform=(btn)=>`<div class=rvf><label>کسٹمر کا نام</label><input id=rn><label>کسٹمر مرد ہے یا عورت؟ (فیڈبیک پر اسی کا آئیکن آئے گا)</label><select id=rg style="width:100%"><option value=m>👨 مرد</option><option value=f>👩 عورت</option></select><label>ستارے</label><select id=rs style="width:100%"><option value=5>⭐⭐⭐⭐⭐</option><option value=4>⭐⭐⭐⭐</option><option value=3>⭐⭐⭐</option></select><label>فیڈبیک</label><textarea id=rx style="min-height:90px"></textarea><button class="btn wa" onclick="${btn}">➕ فیڈبیک شامل کریں</button></div>`;
async function hedit(){try{toast("⏳ لوڈ ہو رہا ہے...");await hload()}catch(e){toast("❌ "+e.message);return}hshow()}
function hshow(){$("#a").innerHTML=`<div class=box><h2 style=margin:0>ہوم پیج کے فیڈبیک</h2><div class=info>یہ ان پروڈکٹس کے فیڈبیک ہیں جو ویب سائٹ پر موجود نہیں۔ یہ ہوم پیج پر "ہیپی کسٹمرز" میں نظر آتے ہیں۔ ہر تبدیلی فوراً محفوظ ہو جاتی ہے۔</div><div>${H.length?H.map((r,i)=>`<div class=rvi><div><b>${esc(r.n)}</b> ${r.g=="f"?"👩":"👨"} — ${esc(r.p||"")}<br>${esc(r.t).slice(0,100)}…</div><button onclick="hdel(${i})">🗑</button></div>`).join(""):"<div class=info>ابھی کوئی فیڈبیک نہیں۔</div>"}</div>${rform("hadd()").replace('<label>فیڈبیک</label>','<label>پروڈکٹ کا نام</label><input id=rp2><label>فیڈبیک</label>')}<button class="btn lt" style=margin-top:8px onclick=list()>واپس</button></div>`}
async function hadd(){const r=rnew();if(!r)return;r.p=$("#rp2").value.trim();H.push(r);try{await hsave("home feedback");toast("✅ محفوظ ہو گیا")}catch(e){H.pop();toast("❌ "+e.message)}hshow()}
async function hdel(i){if(!confirm("یہ فیڈبیک حذف کریں؟"))return;const o=H.splice(i,1)[0];try{await hsave("remove home feedback");toast("🗑 حذف ہو گیا")}catch(e){H.splice(i,0,o);toast("❌ "+e.message)}hshow()}
/* ---- بیک اپ ---- */
async function backup(){try{toast("⏳ بیک اپ تیار ہو رہا ہے...");await load();await hload();const im={};const ns=[...new Set(L.map(p=>p.img).filter(Boolean))];let k=0;
 for(const n of ns){k++;toast("⏳ تصویریں محفوظ ہو رہی ہیں "+k+"/"+ns.length);try{im[n]=await b64of(n)}catch(e){}}
 const d={app:"arfi-shop-backup",v:1,date:new Date().toISOString(),products:L,homeReviews:H,images:im},bl=new Blob([JSON.stringify(d)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(bl);a.download="arfi-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
 toast("✅ بیک اپ ڈاؤن لوڈ ہو گیا ("+L.length+" پروڈکٹس، "+Object.keys(im).length+" تصویریں)")}catch(e){toast("❌ "+e.message)}}
async function restore(inp){const f=inp.files[0];inp.value="";if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){toast("❌ فائل درست نہیں");return}
 if(d.app!="arfi-shop-backup"||!Array.isArray(d.products)){toast("❌ یہ ہماری بیک اپ فائل نہیں");return}
 if(!confirm("بیک اپ ("+d.products.length+" پروڈکٹس، "+Object.keys(d.images||{}).length+" تصویریں) بحال ہو گا۔\nموجودہ تمام پروڈکٹس اور فیڈبیک اس بیک اپ سے بدل جائیں گے۔ جاری رکھیں؟"))return;
 try{const ns=Object.keys(d.images||{});let k=0;
  for(const n of ns){k++;toast("⏳ تصویریں بحال ہو رہی ہیں "+k+"/"+ns.length);let o;try{o=(await gh(n)).sha}catch(e){}await gh(n,"PUT",{message:"restore image "+n,branch:cfg.br,content:d.images[n],...(o?{sha:o}:{})})}
  toast("⏳ پروڈکٹس بحال ہو رہی ہیں...");await load();L=d.products;await save("restore backup");
  await hload();H=d.homeReviews||[];await hsave("restore home feedback");
  k=0;for(const p of L){k++;toast("⏳ لنک بن رہے ہیں "+k+"/"+L.length);try{await ensureStub(p.s||p.id,p.n,p.md)}catch(e){}}
  toast("✅ بیک اپ بحال ہو گیا — 1 سے 2 منٹ میں سائٹ پر نظر آئے گا");list()}catch(e){toast("❌ "+e.message)}}
function login(){$("#a").innerHTML=`<div class=box><h2 style=margin:0>لاگ اِن</h2><label>GitHub ریپوزٹری (مثلاً username/arfi-site)</label><input id=rp dir=ltr value="${cfg.repo||""}"><label>برانچ</label><input id=br dir=ltr value="${cfg.br||"main"}"><label>GitHub ٹوکن</label><input id=tk type=password dir=ltr value="${cfg.tk||""}"><button class="btn wa" onclick=go()>داخل ہوں</button><div class=info>ٹوکن صرف آپ کے اس فون کے براؤزر میں محفوظ رہتا ہے۔</div></div>`}
async function enter(){try{await load();localStorage.setItem("adm",JSON.stringify(cfg));list()}catch(e){login();toast("❌ "+e.message)}}
function go(){cfg={repo:$("#rp").value.trim(),br:$("#br").value.trim()||"main",tk:$("#tk").value.trim()};enter()}
function list(q=""){const x=L.filter(p=>p.n.includes(q));$("#a").innerHTML=`<div class=box><button class="btn wa" onclick="edit(-1)">➕ نئی پروڈکٹ</button><div class=row style=margin-top:8px><button class="btn lt" onclick=hedit()>💬 ہوم پیج فیڈبیک</button><button class="btn lt" onclick=backup()>⬇️ بیک اپ ڈاؤن لوڈ</button><button class="btn lt" onclick="$('#rf').click()">⬆️ بیک اپ بحال کریں</button></div><input id=rf type=file accept=".json,application/json" style=display:none onchange="restore(this)"><input id=q placeholder="تلاش کریں" value="${q}" oninput="list(this.value)" style="margin-top:10px"><div>${x.map(p=>`<div class=it onclick="edit(${L.indexOf(p)})"><img src="${p.img||"logo.webp"}" alt=""><div>${p.n}<small>${(p.v||[]).map(v=>v[1]).join(" / ")} Rs</small></div>›</div>`).join("")}</div><button class="btn lt" style=margin-top:12px onclick="localStorage.removeItem('adm');cfg={};login()">لاگ آؤٹ</button></div>`;const i=$("#q");i.focus();i.setSelectionRange(99,99)}
function edit(i){cur=i;const p=i<0?{id:"p"+Date.now().toString(36),n:"",c:[],v:[["",0]],t:""}:L[i];RT=(p.r||[]).map(x=>({...x}));
$("#a").innerHTML=`<div class=box><h2 style=margin:0>${i<0?"نئی پروڈکٹ":"پروڈکٹ ایڈٹ کریں"}</h2><label>پروڈکٹ کا نام</label><input id=n value="${p.n}"><label>کیٹیگری</label>${CT.map(c=>`<span class=ck><input type=checkbox value=${c[0]} ${p.c.includes(c[0])?"checked":""}>${c[1]}</span>`).join("")}<label>پیکنگ اور قیمت (ہر لائن میں: پیکنگ | قیمت)</label><textarea id=v dir=auto style="min-height:80px">${p.v.map(v=>v[0]+" | "+v[1]).join("\n")}</textarea><div class=info>مثال: 30 کیپسول | 1500<br>قیمت 0 ہو تو "رابطہ کریں" لکھا آئے گا۔</div><label>کسٹم لنک (انگریزی میں)</label><input id=sl dir=ltr value="${p.s||""}" placeholder="muqawi-badan"><div class=info>صرف انگریزی چھوٹے حروف، نمبر اور (-)۔ مثال: muqawi-badan ← لنک بنے گا: آپ کی ویب سائٹ/muqawi-badan<br>خالی چھوڑیں تو خودکار لنک بنے گا۔</div><label>میٹا ڈسکرپشن (گوگل سرچ میں نظر آنے والی مختصر تحریر، تقریباً 150 حروف)</label><textarea id=md style="min-height:70px" maxlength=300>${esc(p.md||"")}</textarea><div class=info>خالی چھوڑیں تو پروڈکٹ کے نام سے خودکار تحریر بن جائے گی۔</div><label>ڈسکرپشن</label><textarea id=t>${p.t||""}</textarea><div class=info>خالی لائن = نیا پیراگراف۔ لائن کے شروع میں "# " = عنوان، "- " = فہرست۔ **موٹا لفظ**۔</div><h3>کسٹمرز کے فیڈبیک</h3><div id=rl></div>${rform("radd()")}<label>ویڈیو لنک (اختیاری)</label><input id=vd dir=ltr value="${p.vid||""}"><label>تصویر</label>${p.img?`<img src="${p.img}" style="width:90px;border-radius:10px"><br>`:""}<input id=im type=file accept=image/*><button class="btn wa" style=margin-top:10px onclick=sv()>💾 محفوظ کریں</button>${i<0?"":`<button class="btn red" style=margin-top:8px onclick=del()>🗑 حذف کریں</button>`}<button class="btn lt" style=margin-top:8px onclick=list()>واپس</button></div>`;rl()}
async function sv(){const n=$("#n").value.trim();if(!n){toast("نام لکھیں");return}toast("⏳ محفوظ ہو رہا ہے...");
 const p=cur<0?{id:"p"+Date.now().toString(36)}:{...L[cur]};p.n=n;p.c=[...document.querySelectorAll(".ck input:checked")].map(x=>x.value);
 p.v=$("#v").value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const k=s.lastIndexOf("|");return k<0?["",Number(s.replace(/\D/g,""))||0]:[s.slice(0,k).trim(),Number(s.slice(k+1).replace(/[^\d.]/g,""))||0]});if(!p.v.length)p.v=[["",0]];
 p.t=$("#t").value.trim();p.vid=$("#vd").value.trim()||undefined;
 const sl=$("#sl").value.trim().toLowerCase();if(sl&&!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(sl)){toast("کسٹم لنک میں صرف انگریزی چھوٹے حروف، نمبر اور (-) لکھیں");return}
 if(sl&&(RES.includes(sl)||L.some((x,j)=>j!=cur&&(x.s||x.id)==sl))){toast("یہ لنک پہلے سے استعمال ہو رہا ہے، کوئی اور لکھیں");return}
 p.s=sl||undefined;p.md=$("#md").value.trim()||undefined;p.r=RT.length?RT:undefined;
 try{const f=$("#im").files[0];if(f){const b=await createImageBitmap(f),s=Math.min(1,700/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=b.width*s;c.height=b.height*s;c.getContext("2d").drawImage(b,0,0,c.width,c.height);const nm=p.id+".jpg";let o;try{o=(await gh(nm)).sha}catch(e){}
  await gh(nm,"PUT",{message:"image "+nm,branch:cfg.br,content:c.toDataURL("image/jpeg",.82).split(",")[1],...(o?{sha:o}:{})});p.img=nm}
  cur<0?L.push(p):L[cur]=p;await save((cur<0?"add ":"edit ")+p.n);try{await ensureStub(p.s||p.id,p.n,p.md)}catch(e){}toast("✅ محفوظ ہو گیا — 1 سے 2 منٹ میں سائٹ پر نظر آئے گا");list()}catch(e){toast("❌ "+e.message)}}
async function del(){if(!confirm("یہ پروڈکٹ مستقل حذف ہو جائے گی۔ ٹھیک ہے؟"))return;try{const n=L[cur].n;L.splice(cur,1);await save("delete "+n);toast("🗑 حذف ہو گئی");list()}catch(e){toast("❌ "+e.message)}}
cfg.tk&&cfg.repo?enter():login();
</script></body></html>
